# 部署环境（Vercel＋Neon Postgres）。Dockerfile 里设定 SPRING_PROFILES_ACTIVE=prod 生效。
# 连接信息来自 Vercel 的 Neon 集成注入的环境变量（不写进代码）
spring.datasource.url=jdbc:postgresql://${PGHOST_UNPOOLED:${PGHOST}}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

# 数据库是持久的、多个实例共用：不能每次启动都删表
spring.jpa.hibernate.ddl-auto=update

# 登录状态（session）存进数据库，请求落到哪个实例都能认出
spring.session.jdbc.initialize-schema=always

spring.h2.console.enabled=false
spring.thymeleaf.cache=true
