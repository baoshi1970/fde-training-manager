<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>课程管理 | 培训管理系统</title></head>
<body>
<section>
    <div class="page-head">
        <h1>课程管理</h1>
        <a class="btn" th:href="@{/courses/new}">＋ 新增课程</a>
    </div>
    <table>
        <thead><tr><th>编号</th><th>名称</th><th>类别</th><th>必修</th><th>学时</th><th>相关</th><th>操作</th></tr></thead>
        <tbody>
        <tr th:each="c : ${courses}">
            <td th:text="${c.code}">S2</td>
            <td th:text="${c.name}">AI 辅助编码</td>
            <td th:text="${c.category.label}">公共基础</td>
            <td th:text="${c.required} ? '必修' : '选修'">必修</td>
            <td th:text="${c.hours + ' h'}">16 h</td>
            <td>
                <a th:href="@{/sessions(courseId=${c.id})}">课次</a> ／
                <a th:href="@{/enrollments(courseId=${c.id})}">报名者</a>
            </td>
            <td class="actions">
                <a class="btn small secondary" th:href="@{/courses/{id}/edit(id=${c.id})}">编辑</a>
                <form th:action="@{/courses/{id}/delete(id=${c.id})}" method="post"
                      onsubmit="return confirm('确定删除这门课程吗？');">
                    <button type="submit" class="btn small danger">删除</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(courses)}"><td colspan="7" class="empty">还没有课程</td></tr>
        </tbody>
    </table>
</section>
</body>
</html>
