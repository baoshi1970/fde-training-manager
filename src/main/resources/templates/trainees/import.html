<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>CSV 导入学员 | 培训管理系统</title></head>
<body>
<section>
    <h1>CSV 导入学员</h1>

    <!-- 行级错误：全部列出（值来自用户上传的文件，必须用 th:text 转义） -->
    <div class="flash ng" th:if="${errors}">
        <ul>
            <li th:each="e : ${errors}" th:text="${e}">第 3 行：邮箱格式不正确</li>
        </ul>
    </div>

    <form class="form" th:action="@{/trainees/import}" method="post" enctype="multipart/form-data">
        <div class="field">
            <label for="file">CSV 文件 *</label>
            <input type="file" id="file" name="file" accept=".csv">
            <div class="hint">
                <ul>
                    <li>第 1 行是表头，列顺序固定：<code>name,email,affiliation,joinedOn</code></li>
                    <li>字符编码 UTF-8（带 BOM 也可以）。Excel 请用「另存为」→「CSV UTF-8（逗号分隔）」</li>
                    <li>数据行最多 500 行</li>
                    <li>状态一律登记为「在籍」</li>
                    <li>有任何 1 行错误时，一条也不登记</li>
                </ul>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">导入</button>
            <a class="btn secondary" th:href="@{/trainees}">返回</a>
        </div>
    </form>
</section>
</body>
</html>
