<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>讲师编辑 | 培训管理系统</title></head>
<body>
<section>
    <h1 th:text="${instructor.id == null} ? '新增讲师' : '编辑讲师'">新增讲师</h1>
    <form class="form" th:object="${instructor}" method="post"
          th:action="${instructor.id == null} ? @{/instructors} : @{/instructors/{id}(id=${instructor.id})}">
        <div class="field">
            <label for="name">姓名 *</label>
            <input type="text" th:field="*{name}">
            <div class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="field">
            <label for="email">邮箱 *</label>
            <input type="email" th:field="*{email}">
            <div class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="field">
            <label for="specialty">擅长领域</label>
            <input type="text" th:field="*{specialty}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">保存</button>
            <a class="btn secondary" th:href="@{/instructors}">返回</a>
        </div>
    </form>
</section>
</body>
</html>
