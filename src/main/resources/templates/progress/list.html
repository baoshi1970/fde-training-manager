<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>学员进度看板 | 培训管理系统</title></head>
<body>
<section>
    <div class="page-head">
        <h1>学员进度看板</h1>
    </div>

    <form class="search" th:action="@{/progress}" method="get">
        <label><input type="checkbox" name="attention" value="true" th:checked="${attention}"> 只看要关注</label>
        <button type="submit" class="btn secondary">检索</button>
        <a th:href="@{/progress}">清除条件</a>
    </form>

    <p class="note">出勤率 ＝（出席＋迟到）÷ 已登记出勤的课次数，只统计今天及以前的课次。
        平均分只算已完成评分的课程。出勤率低于 80% 或有 D 评级 → 要关注。</p>

    <table>
        <thead><tr><th>学员</th><th>报名课程数</th><th>出勤率</th><th>迟到次数</th><th>平均分</th><th>要关注</th></tr></thead>
        <tbody>
        <tr th:each="r : ${rows}" th:classappend="${r.progress.attention} ? 'attention'">
            <td th:text="${r.trainee.name}">山田 太郎</td>
            <td th:text="${r.courseCount}">3</td>
            <td th:text="${r.progress.attendanceRate != null} ? ${r.progress.attendanceRate + '%'} : '—'">75%</td>
            <td th:text="${r.progress.lateCount}">1</td>
            <td th:text="${r.progress.averageScore != null} ? ${r.progress.averageScore} : '—'">79.0</td>
            <td><span th:if="${r.progress.attention}" class="badge ng">要关注</span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(rows)}">
            <td colspan="6" class="empty" th:text="${attention} ? '没有要关注的学员' : '没有在籍学员'">没有在籍学员</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
