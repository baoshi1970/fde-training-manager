spring.application.name=training-manager
server.port=${PORT:8080}
# 部署在代理（Vercel）后面时，重定向用相对路径，避免跳到内部地址或 http
server.tomcat.use-relative-redirects=true
server.forward-headers-strategy=framework

# H2 内存数据库：每次启动都是全新的，种子数据由 DataInitializer 写入
spring.datasource.url=jdbc:h2:mem:training;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 调试用：http://localhost:8080/h2-console （JDBC URL 填 jdbc:h2:mem:training）
# ★公开部署时必须关闭（Dockerfile 里用环境变量 SPRING_H2_CONSOLE_ENABLED=false 关掉）
spring.h2.console.enabled=true

# 错误画面只在 404 时显示 message（见 templates/error.html）
server.error.include-message=always

spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8
server.servlet.encoding.force=true
