spring.application.name=training-manager
server.port=8080

# H2 内存数据库：每次启动都是全新的，种子数据由 DataInitializer 写入
spring.datasource.url=jdbc:h2:mem:training;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 调试用：http://localhost:8080/h2-console （JDBC URL 填 jdbc:h2:mem:training）
spring.h2.console.enabled=true

# 错误画面只在 404 时显示 message（见 templates/error.html）
server.error.include-message=always

spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8
server.servlet.encoding.force=true
